syntax = "proto3";

package ruoyi.member.v1;

option go_package = "ruoyi/all-next/gen/member/v1;memberv1";

// Generated from src/modules/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: npm run domain:contracts
// gRPC path: /ruoyi.member.v1.MemberService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
  optional string level_id = 4 [json_name = "levelId"];
}

message UpdateUserRequest {
  string id = 1;
  optional string nickname = 2;
  optional string mobile = 3;
  optional string level_id = 4 [json_name = "levelId"];
}

message ListLevelsRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message CreateLevelRequest {
  string name = 1;
  int32 min_point = 2 [json_name = "minPoint"];
  double discount = 3;
  optional string icon = 4;
}

message ListPointsRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message AdjustPointRequest {
  string user_id = 1 [json_name = "userId"];
  int32 point = 2;
  string remark = 3;
}

service MemberService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc ListUsers(ListUsersRequest) returns (JsonReply);
  rpc UpdateUser(UpdateUserRequest) returns (JsonReply);
  rpc ListLevels(ListLevelsRequest) returns (JsonReply);
  rpc CreateLevel(CreateLevelRequest) returns (JsonReply);
  rpc ListPoints(ListPointsRequest) returns (JsonReply);
  rpc AdjustPoint(AdjustPointRequest) returns (JsonReply);
}
