syntax = "proto3";

package ruoyi.wms.v1;

option go_package = "ruoyi/all-next/gen/wms/v1;wmsv1";

// Generated from src/modules/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: npm run domain:contracts
// gRPC path: /ruoyi.wms.v1.WmsService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message ListWarehousesRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message CheckinRequest {
  string warehouse_id = 1 [json_name = "warehouseId"];
  int32 quantity = 2;
  optional string note = 3;
}

service WmsService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc ListWarehouses(ListWarehousesRequest) returns (JsonReply);
  rpc Checkin(CheckinRequest) returns (JsonReply);
}
