syntax = "proto3";

package ruoyi.ai.v1;

option go_package = "ruoyi/all-next/gen/ai/v1;aiv1";

// Generated from src/modules/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: npm run domain:contracts
// gRPC path: /ruoyi.ai.v1.AiService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message ListModelsRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message CreateModelRequest {
  string name = 1;
  string platform = 2;
  string model = 3;
  string api_key = 4 [json_name = "apiKey"];
  optional string api_url = 5 [json_name = "apiUrl"];
  optional double temperature = 6;
  optional int32 max_tokens = 7 [json_name = "maxTokens"];
}

message ListChatsRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
}

message DeleteChatRequest {
  string chat_id = 1 [json_name = "chatId"];
}

service AiService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc ListModels(ListModelsRequest) returns (JsonReply);
  rpc CreateModel(CreateModelRequest) returns (JsonReply);
  rpc ListChats(ListChatsRequest) returns (JsonReply);
  rpc DeleteChat(DeleteChatRequest) returns (JsonReply);
}
