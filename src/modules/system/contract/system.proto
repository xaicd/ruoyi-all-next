syntax = "proto3";

package ruoyi.system.v1;

option go_package = "ruoyi/all-next/gen/system/v1;systemv1";

// Generated from src/modules/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: npm run domain:contracts
// gRPC path: /ruoyi.system.v1.SystemService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message GetDictDataByTypeRequest {
  string type = 1;
}

message ResolveTenantEntitlementRequest {
  string tenant_id = 1 [json_name = "tenantId"];
}

service SystemService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc GetDictDataByType(GetDictDataByTypeRequest) returns (JsonReply);
  rpc ResolveTenantEntitlement(ResolveTenantEntitlementRequest) returns (JsonReply);
}
