module: online
version: v1
routes:
  - { method: GET, path: /api/v1/admin/online/definitions, permission: infra:online-definition:query, tenantScope: required, timeoutMs: 5000 }
  - { method: POST, path: /api/v1/admin/online/definitions, permission: infra:online-definition:create, tenantScope: required, timeoutMs: 5000 }
  - { method: GET, path: /api/v1/admin/online/definitions/{code}, permission: infra:online-definition:query, tenantScope: required, timeoutMs: 5000 }
  - { method: PUT, path: /api/v1/admin/online/definitions/{code}, permission: infra:online-definition:update, tenantScope: required, timeoutMs: 5000 }
  - { method: DELETE, path: /api/v1/admin/online/definitions/{code}, permission: infra:online-definition:delete, tenantScope: required, timeoutMs: 5000 }
  - { method: POST, path: /api/v1/admin/online/definitions/{code}/archive, permission: infra:online-definition:update, tenantScope: required, timeoutMs: 5000 }
  - { method: POST, path: /api/v1/admin/online/definitions/{code}/normalize-system-fields, permission: infra:online-definition:update, tenantScope: required, timeoutMs: 5000 }
  - { method: PUT, path: /api/v1/admin/online/definitions/{code}/draft, permission: infra:online-definition:update, tenantScope: required, timeoutMs: 5000 }
  - { method: POST, path: /api/v1/admin/online/definitions/{code}/validate, permission: infra:online-definition:update, tenantScope: required, timeoutMs: 5000 }
  - { method: POST, path: /api/v1/admin/online/definitions/{code}/publish, permission: infra:online-definition:publish, tenantScope: required, timeoutMs: 5000 }
  - { method: POST, path: /api/v1/admin/online/definitions/{code}/rollback, permission: infra:online-definition:publish, tenantScope: required, timeoutMs: 5000 }
  - { method: GET, path: /api/v1/admin/online/definitions/{code}/schema-plans, permission: infra:online-definition:query, tenantScope: required, timeoutMs: 5000 }
  - { method: POST, path: /api/v1/admin/online/definitions/{code}/schema-plans, permission: infra:online-definition:migrate, tenantScope: required, timeoutMs: 5000 }
  - { method: GET, path: /api/v1/admin/online/definitions/{code}/schema-plans/{planId}, permission: infra:online-definition:query, tenantScope: required, timeoutMs: 5000 }
  - { method: POST, path: /api/v1/admin/online/definitions/{code}/schema-plans/{planId}/approve, permission: infra:online-definition:migrate, tenantScope: required, timeoutMs: 5000 }
  - { method: POST, path: /api/v1/admin/online/definitions/{code}/test-sessions, permission: infra:online-definition:test, tenantScope: required, timeoutMs: 5000 }
  - { method: GET, path: /api/v1/admin/online/definitions/{code}/test-sessions/{sessionId}, permission: infra:online-definition:test, tenantScope: required, timeoutMs: 5000 }
  - { method: GET, path: /api/v1/admin/online/definitions/{code}/test-sessions/{sessionId}/records, permission: infra:online-definition:test, tenantScope: required, timeoutMs: 5000 }
  - { method: POST, path: /api/v1/admin/online/definitions/{code}/test-sessions/{sessionId}/records, permission: infra:online-definition:test, tenantScope: required, timeoutMs: 5000 }
  - { method: PUT, path: /api/v1/admin/online/definitions/{code}/test-sessions/{sessionId}/records/{recordId}, permission: infra:online-definition:test, tenantScope: required, timeoutMs: 5000 }
  - { method: DELETE, path: /api/v1/admin/online/definitions/{code}/test-sessions/{sessionId}/records/{recordId}, permission: infra:online-definition:test, tenantScope: required, timeoutMs: 5000 }
notes:
  - Schema Plan routes create, query, and approve semantic model-diff records only; no endpoint accepts, emits, or executes SQL.
  - Dynamic DDL apply is intentionally unavailable in this phase, including for approved plans.
  - Runtime and Online Test routes resolve only the current Published Release and only support the sandboxed GENERIC_RECORD SINGLE model in this phase.
  - Each Online Test Session is actor-owned; every sandbox record is scoped to tenant, Definition, immutable Release and test session.
