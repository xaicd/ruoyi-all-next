syntax = "proto3";

package ruoyi.online.v1;

option go_package = "ruoyi/all-next/gen/online/v1;onlinev1";

// Generated from src/modules/shared/backend/constants/rpc-actions.json
// Do not hand-edit. Run: npm run domain:contracts
// gRPC path: /ruoyi.online.v1.OnlineService/<Method>

message JsonReply {
  string json = 1;
}

message PingRequest {
  optional int32 n = 1;
}

message PageDefinitionsRequest {
  int32 page = 1;
  int32 page_size = 2 [json_name = "pageSize"];
  optional string keyword = 3;
  optional string model_type = 4 [json_name = "modelType"];
  optional string status = 5;
}

service OnlineService {
  rpc Ping(PingRequest) returns (JsonReply);
  rpc PageDefinitions(PageDefinitionsRequest) returns (JsonReply);
}
