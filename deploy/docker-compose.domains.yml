# ============================================================
# ruoyi-all-next - 模块化独立部署（BFF + 可选域服务）
# 页面始终由 BFF 提供；设置 RUOYI_DOMAIN_<NAME>_UPSTREAM 后，对应 /api/v1/**/<domain> 由域进程承接。
#
# 一体（单进程，Facade=SDK）：
#   docker compose -f deploy/docker-compose.domains.yml up --build
#   npm run runtime:all
# 拆出 pay（BFF HTTP 反代 + Facade RPC）：
#   docker compose -f deploy/docker-compose.domains.yml --profile pay up --build
#   npm run runtime:split
#   npm run domain:up -- pay
# ============================================================

services:
  bff:
    image: ${REGISTRY:-registry.local}/ruoyi-all-next:${TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - DB_DRIVER=${DB_DRIVER:-postgresql}
      - DATABASE_URL=${DATABASE_URL:-postgresql://ruoyi:ruoyi123@postgres:5432/ruoyi_next?schema=public}
      - JWT_SECRET=${JWT_SECRET:-dev-team-secret-2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-86400}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RUOYI_DOMAIN_PAY_UPSTREAM=${RUOYI_DOMAIN_PAY_UPSTREAM:-}
      - RUOYI_RPC_TOKEN=${RUOYI_RPC_TOKEN:-}
      - RUOYI_RPC_GATEWAY=${RUOYI_RPC_GATEWAY:-}
    depends_on:
      postgres:
        condition: service_healthy
      pay:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  pay:
    profiles: ["pay"]
    image: ${REGISTRY:-registry.local}/ruoyi-domain-pay:${TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile.domain
      args:
        RUOYI_PACK_DOMAIN: pay
    expose:
      - "3100"
    environment:
      - NODE_ENV=production
      - RUOYI_PACK_DOMAIN=pay
      - DB_DRIVER=${DB_DRIVER:-postgresql}
      - DATABASE_URL=${DATABASE_URL:-postgresql://ruoyi:ruoyi123@postgres:5432/ruoyi_next?schema=public}
      - JWT_SECRET=${JWT_SECRET:-dev-team-secret-2026}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-86400}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RUOYI_RPC_TOKEN=${RUOYI_RPC_TOKEN:-dev-rpc-token}
      - RUOYI_RPC_GATEWAY=${RUOYI_RPC_GATEWAY:-http://bff:3100}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${PG_USER:-ruoyi}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-ruoyi123}
      - POSTGRES_DB=${PG_DB:-ruoyi_next}
    volumes:
      - pg_data_domains:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-ruoyi}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data_domains:
